name: Integrate Employee Master Profile
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/employee-profile-integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Employee Profile logo-only header patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('employee-profile-extension.js')
          s = p.read_text(encoding='utf-8')
          old = '.empHead img{width:120px;height:62px;object-fit:contain;background:#fff;border-radius:7px}'
          new = '.empHead img{width:62px;height:62px;object-fit:cover;object-position:left center;background:#fff;border-radius:7px}'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Employee Profile header image CSS marker not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit logo-only header patch
        run: |
          git config user.name "myedengp01"
          git config user.email "myeden.group@gmail.com"
          git add employee-profile-extension.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use logo only in Employee Master Profile header"
          git push
